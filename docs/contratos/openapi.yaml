          description: Mensagem encaminhada e identificadores de acompanhamento.
          content:
            application/json:
              schema:
                $ref: ./schemas/v1.json#/$defs/SimulatorReceipt
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: _cloudwalk_session
      description: Sessão HTTP-only na origem da aplicação.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Token retornado pelo endpoint de sessão para escritas.
    WebhookTimestamp:
      type: apiKey
      in: header
      name: X-Webhook-Timestamp
      description: Unix epoch em segundos, decimal, com janela de tolerância de 300 s.
    WebhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: 64 dígitos hexadecimais minúsculos do HMAC-SHA256 de timestamp + ponto + bytes do corpo.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco de próxima página, associado aos filtros da consulta.
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Quantidade máxima de itens.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave única por ator, operação e recurso. A mesma chave e conteúdo repetem o resultado original.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    Error401:
      description: Sessão ausente, credenciais inválidas ou autenticação do webhook recusada.
      content:
        application/json:
          schema:
            $ref: ./schemas/v1.json#/$defs/Error
    Error403:
      description: Ator autenticado sem permissão ou token CSRF recusado.
      content:
        application/json:
          schema:
            $ref: ./schemas/v1.json#/$defs/Error
    Error404:
      description: Recurso inexistente ou oculto para a sessão.
      content:
        application/json:
          schema:
            $ref: ./schemas/v1.json#/$defs/Error
    Error409:
      description: Versão divergente, ação incompatível com o estado ou chave de idempotência reutilizada com outro conteúdo.
      content:
        application/json:
          schema:
            $ref: ./schemas/v1.json#/$defs/Error
    Error422:
      description: Envelope inválido ou regra de domínio não satisfeita na edição.
      content:
        application/json:
          schema:
            $ref: ./schemas/v1.json#/$defs/Error
    Error503:
      description: Dependência temporariamente indisponível. Tentar novamente com a mesma identidade da operação.
      content:
        application/json:
          schema:
            $ref: ./schemas/v1.json#/$defs/Error
