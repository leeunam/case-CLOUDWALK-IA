    post:
      operationId: sendSimulatorMessage
      summary: Enviar mensagem pela sessão de simulação
      x-implementation-phase: F05
      security:
      - SessionCookie: []
        CsrfToken: []
      tags:
      - API da aplicação
      description: Rails identifica a sessão, gera IDs externos e passa pela mesma fronteira de entrada por meio da simulação
        no servidor. Na continuação, Rails exige que canal e conversa pertençam à sessão e que a conversa use o canal
        da rota. Com X-Simulator-Session-Id, uma sessão autenticada diferente da esperada devolve 409 simulator_session_changed.
        Um valor malformado devolve 422 invalid_simulator_session_id.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: X-Simulator-Session-Id
        in: header
        required: false
        description: ID da identidade sintética vigente no início da tentativa. O React repete o ID, a chave e o corpo
          originais se precisar confirmar o envio. O cookie autentica a requisição. O ID informado apenas verifica a
          identidade e pode ser omitido por clientes anteriores.
