default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("POSTGRES_HOST", "db") %>
  username: <%= ENV.fetch("POSTGRES_USER", "cloudwalk") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "cloudwalk_local") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  primary:
    <<: *default
    database: cloudwalk_development
  queue:
    <<: *default
    database: cloudwalk_development_queue
    migrations_paths: db/queue_migrate

test:
  primary:
    <<: *default
    database: cloudwalk_test
  queue:
    <<: *default
    database: cloudwalk_test_queue
    migrations_paths: db/queue_migrate

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "cloudwalk_production") %>
  queue:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_QUEUE_DB", "cloudwalk_production_queue") %>
    migrations_paths: db/queue_migrate
