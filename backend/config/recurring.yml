development:
  distribute_human_work: &distribute_human_work
    class: "Attendances::DistributeHumanWorkJob"
    schedule: every minute

  recover_classifications: &recover_classifications
    class: "Classification::RecoverRequestsJob"
    schedule: every minute

production:
  distribute_human_work: *distribute_human_work
  recover_classifications: *recover_classifications
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
